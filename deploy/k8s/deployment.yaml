# Multi-pod deployment for a sutegi app. Demonstrates the production shape:
# 3 replicas, liveness/readiness probes against the built-in endpoints,
# graceful drain on SIGTERM, Prometheus scrape annotations, and modest
# resource asks (the binary is tiny, so requests can be small).
#
# The /__ ops surface (metrics, introspect, tools) needs `Authorization: Bearer
# $OPS_TOKEN`; without the secret it stays closed (403). Create it with
#   kubectl create secret generic sutegi-todo-ops --from-literal=token=$(openssl rand -hex 32)
# and give the Prometheus scrape job the same bearer token (annotation-based
# discovery alone cannot authenticate).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sutegi-todo
  labels:
    app: sutegi-todo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sutegi-todo
  template:
    metadata:
      labels:
        app: sutegi-todo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /__metrics
        prometheus.io/port: "8080"
    spec:
      # Allow in-flight requests to drain before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: sutegi-todo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
            - { name: WORKERS, value: "8" }
            - name: OPS_TOKEN
              valueFrom:
                secretKeyRef: { name: sutegi-todo-ops, key: token, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /__health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /__ready, port: 8080 }
            periodSeconds: 5
            failureThreshold: 2
          # No exec preStop hook: the distroless image has no `sleep` (or any
          # shell), so one would fail. The app drains on SIGTERM within
          # terminationGracePeriodSeconds. On Kubernetes >= 1.30 you can add
          # `lifecycle: { preStop: { sleep: { seconds: 5 } } }` (native, no binary)
          # to let the Service deregister the pod before draining.
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: sutegi-todo
spec:
  selector:
    app: sutegi-todo
  ports:
    - port: 80
      targetPort: 8080
