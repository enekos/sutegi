name: Documentation

on:
  push:
    branches: [master]
    paths: ["landing/**", "docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [master]
    paths: ["landing/**", "docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
