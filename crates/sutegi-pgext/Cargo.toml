[package]
name = "sutegi-pgext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Write PostgreSQL extensions in Rust with #[pg_function], set-returning SQL functions, and parameterized queries through SPI."
readme = "README.md"
include = ["src/**", "csrc/**", "Cargo.toml", "README.md"]

[features]
# The extension build pipeline (scan, codegen, cargo + PGXS) used by the
# `sutegi` CLI. Extensions themselves never enable it.
build = ["dep:sutegi-json"]

[dependencies]
sutegi-macros = { path = "../sutegi-macros", version = "0.16.0" }
sutegi-json = { path = "../sutegi-json", version = "0.16.0", optional = true }

[lints]
workspace = true
