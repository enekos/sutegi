[package]
name = "sutegi-orm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SQL query builder, models, schema diffs, and migrations for Sutegi applications using SQLite or PostgreSQL."

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "hooks"], optional = true }
sutegi-pg = { path = "../sutegi-pg", version = "0.16.0", optional = true }
sutegi-crypto = { path = "../sutegi-crypto", version = "0.16.0" }
sutegi-json = { path = "../sutegi-json", version = "0.16.0" }

# Both execution backends are OFF by default so the zero-dependency core stays
# tiny. Enable one to get a runnable layer over the same query builder:
#   --features sqlite     bundled SQLite (one C library, single-process)
#   --features postgres   pure-std Postgres driver (no deps, cross-pod)
[features]
sqlite = ["dep:rusqlite"]
postgres = ["dep:sutegi-pg"]

[lints]
workspace = true
