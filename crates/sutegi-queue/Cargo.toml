[package]
name = "sutegi-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Durable job queues on SQLite and PostgreSQL with atomic claims, retries, deduplication, and dead-letter handling."

[dependencies]
sutegi-orm = { path = "../sutegi-orm", version = "0.16.0" }
sutegi-json = { path = "../sutegi-json", version = "0.16.0" }
sutegi-log = { path = "../sutegi-log", version = "0.16.0" }

# The queue is backend-agnostic — these only decide which backend its own tests
# can reach. An app enables its backend on sutegi-orm (or the sutegi facade).
[features]
sqlite = ["sutegi-orm/sqlite"]
postgres = ["sutegi-orm/postgres"]

[dev-dependencies]
sutegi-orm = { path = "../sutegi-orm", version = "0.16.0", features = ["sqlite"] }

[lints]
workspace = true
