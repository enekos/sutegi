[package]
name = "sutegi-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Event sourcing on SQLite and PostgreSQL for Sutegi, with append-only streams, optimistic concurrency, and transactional projections."
keywords = ["event-sourcing", "cqrs", "events", "projections", "zero-dependency"]
categories = ["database", "web-programming"]

[dependencies]
sutegi-crypto = { path = "../sutegi-crypto", version = "0.16.0" }
sutegi-json = { path = "../sutegi-json", version = "0.16.0" }
sutegi-log = { path = "../sutegi-log", version = "0.16.0" }
sutegi-orm = { path = "../sutegi-orm", version = "0.16.0" }

[dev-dependencies]
sutegi-orm = { path = "../sutegi-orm", version = "0.16.0", features = ["sqlite", "postgres"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
