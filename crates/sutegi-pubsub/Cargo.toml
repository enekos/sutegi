[package]
name = "sutegi-pubsub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Publish and subscribe to topics in-process or across Sutegi instances using PostgreSQL LISTEN/NOTIFY."
keywords = ["pubsub", "broker", "realtime", "zero-dependency"]
categories = ["web-programming", "concurrency"]

[dependencies]
sutegi-log = { path = "../sutegi-log", version = "0.16.0" }
sutegi-pg = { path = "../sutegi-pg", version = "0.16.0", optional = true }
sutegi-json = { path = "../sutegi-json", version = "0.16.0", optional = true }

[features]
# Cross-pod fan-out over PostgreSQL LISTEN/NOTIFY (PgPubSub). Off by default
# so the in-process broker stays dependency-free.
postgres = ["dep:sutegi-pg", "dep:sutegi-json"]

[lints]
workspace = true
