[package]
name = "sutegi-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Topic-based WebSocket channels for Sutegi with authenticated joins, replies, broadcasts, and optional presence tracking."
keywords = ["channels", "websocket", "realtime", "pubsub", "zero-dependency"]
categories = ["web-programming", "web-programming::websocket"]

[dependencies]
sutegi-json = { path = "../sutegi-json", version = "0.16.0" }
sutegi-http = { path = "../sutegi-http", version = "0.16.0" }
sutegi-ws = { path = "../sutegi-ws", version = "0.16.0" }
sutegi-pubsub = { path = "../sutegi-pubsub", version = "0.16.0" }

[features]
# Presence: a per-pod tracker over the Broker seam with cross-pod state sync
# and heartbeat expiry (see src/presence.rs for the honest caveats).
presence = []

[lints]
workspace = true
